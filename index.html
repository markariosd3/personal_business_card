<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark A. Rios - Contact</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
            background-size: 400% 400%;
            animation: rainbowShift 8s ease-in-out infinite;
            color: white;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        @keyframes rainbowShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        .container { 
            padding: 20px; 
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin: 20px auto;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .image-container {
            position: relative;
            width: 300px; /* Same width as image */
            height: 390px;
            overflow: hidden;
            display: inline-block;
        }
        .image-container img {
            position: absolute;
            width: 300px;
            border-radius: 5%;
            transition: left 0.5s ease-in-out;
        }
        .image-container img:first-child {
            left: 0;
        }
        .image-container img:last-child {
            left: 100%;
        }
        .btn {
            display: block;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57, #ff9ff3);
            background-size: 300% 300%;
            animation: buttonRainbow 3s ease-in-out infinite;
            color: white;
            padding: 15px;
            margin: 15px auto;
            width: 80%;
            text-decoration: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        @keyframes buttonRainbow {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        h1, h2 {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            margin: 20px 0;
        }
        
        h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowText 4s ease-in-out infinite;
        }
        
        h2 {
            font-size: 1.5em;
            color: #fff;
        }
        
        @keyframes rainbowText {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="image-container" id="imageSlider">
           <!--- <img src="MarkRios.png" alt="Mark A. Rios"> -->
            <img src="IMG_3436.jpg" alt="Mark A. Rios">
            <img src="markarios_personal_qr_code.png" alt="Revealed Image">
        </div>
        
        <h1>Mark A. Rios</h1>
        <h2>Portland Oregon</h2>
        <a class="btn" href="sms:+15303078202">💬 Text (530) 307-8202</a>
        <a class="btn" href="markarios.vcf" download="markarios.vcf">📥 Save Contact</a>
        <a class="btn" href="https://www.instagram.com/iosmarkr/">📸 Instagram</a>
        <a class="btn" href="https://www.linkedin.com/in/markarios/">🔗in Linkedin</a>
        <a class="btn" href="https://www.facebook.com/mark.rios1">📘 Facebook</a>
        <!-- <a class="btn" href="Mark Rios Resume.pdf">Resume</a> -->
        
    </div>

    <script>
        let showingQR = false;
        
        document.getElementById("imageSlider").addEventListener("click", function() {
            const images = this.getElementsByTagName("img");
            
            if (!showingQR) {
                // Show QR code
                images[0].style.left = "-100%";
                images[1].style.left = "0";
                showingQR = true;
            } else {
                // Show original picture
                images[0].style.left = "0";
                images[1].style.left = "100%";
                showingQR = false;
            }
        });
    </script>
</body>
</html>
